services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecapi_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecapi_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "54329:5432"
